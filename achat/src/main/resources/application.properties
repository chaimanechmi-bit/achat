spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/achatdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =========================
# SERVER
# =========================
server.port=${SERVER_PORT:8089}

# =========================
# ACTUATOR
# =========================
management.endpoints.web.exposure.include=health,info,prometheus,metrics,loggers,env
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true

management.metrics.tags.application=${spring.application.name:achat-app}

management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.hikaricp=true

# =========================
# LOGGING
# =========================
logging.level.root=INFO
logging.level.tn.esprit=DEBUG